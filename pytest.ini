[pytest]
testpaths = tests
# etl/ is imported as a package from the repo root (`from etl.orchestrator import ...`),
# so the root must be on sys.path. Importing etl.orchestrator has no side effects.
pythonpath = .
# `-m "not live"` is what actually excludes the service-dependent tests; a command-line
# -m overrides it (run them with: pytest -m live).
addopts = -q --strict-markers -m "not live"
markers =
    live: needs the real held packages under data/held (produced by an ingest run); excluded by default
